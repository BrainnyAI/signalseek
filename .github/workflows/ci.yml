name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Python syntax check
        run: python -m py_compile main.py models.py monitor.py scorer.py alerts.py

      - name: Unit tests (scorer)
        run: python scorer.py

      - name: Import check
        run: python -c "from models import init_db; init_db(); print('DB init OK')"
